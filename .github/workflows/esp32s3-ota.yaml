name: ESP32-S3 OTA firmware

on:
  workflow_dispatch:
  push:
    branches: [main, 'prep/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: esp32s3-ota-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Build ESP32-S3 OTA binary
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: |
          npm install --global pnpm@12.8.1
          pnpm install --frozen-lockfile
      - name: Rebuild embedded web application
        working-directory: frontend
        run: |
          pnpm build
          test -s dist/index.html
          test -s ../src/webgui.cpp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      # Use the checked-in default credentials, never embed private credentials in
      # public artifacts. See docs/esp32s3-ota.md before installing this firmware.
      - name: Build firmware (no upload)
        run: pio run -e esp32s3
      - name: Package application binary and build provenance
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p ota-artifact
          cp .pio/build/esp32s3/firmware.bin ota-artifact/esp32s3_firmware.bin
          cp partitions-4MB.csv platformio.ini ota-artifact/
          cp docs/esp32s3-ota.md ota-artifact/UPLOAD-GUIDE.md
          pio pkg list -e esp32s3 > ota-artifact/packages.txt
          python scripts/package_esp32s3_ota.py
          cd ota-artifact
          sha256sum esp32s3_firmware.bin > SHA256SUMS
      - name: Downloadable OTA artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-ota-${{ github.run_number }}-${{ github.run_attempt }}
          path: ota-artifact/
          if-no-files-found: error
          retention-days: 90
      - name: Explain artifact
        run: |
          echo 'Download the esp32s3-ota artifact below and unzip it. Upload only esp32s3_firmware.bin through the device /update page in Firmware mode. Read UPLOAD-GUIDE.md first. This workflow never contacts the display.' >> "$GITHUB_STEP_SUMMARY"
